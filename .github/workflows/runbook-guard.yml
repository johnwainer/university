name: Runbook Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify-runbook-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify PROJECT_RUNBOOK update on functional changes
        run: npm run check:runbook
