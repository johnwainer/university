; zz-moodle.ini -> /opt/bitnami/php/etc/conf.d/zz-moodle.ini
;
; PHP settings Moodle 4.5 requires or strongly recommends. Installed by
; 20-moodle-install.sh. Loaded after zz-upload.ini (alphabetical), so the
; upload limits defined there stay in force - nothing here overrides them.

; Moodle's admin forms (role definitions, grade setup, question bank) submit
; far more than the PHP default of 1000 inputs. Moodle's own environment check
; fails below 5000.
max_input_vars = 5000

; Required by Moodle's environment check.
file_uploads = On
session.auto_start = Off
; Moodle manages its own slash handling and output buffering.
output_buffering = Off
; Moodle does its own locale handling; a hard default avoids date drift.
date.timezone = America/New_York

; Needed so long restores / large course backups do not die mid-way.
; (max_execution_time / max_input_time are already unlimited in zz-upload.ini.)
default_socket_timeout = 300

; OPcache: big win for Moodle, which loads hundreds of PHP files per request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 16000
opcache.revalidate_freq = 60
opcache.use_cwd = 1
opcache.validate_timestamps = 1
opcache.save_comments = 1
; Must stay off: Moodle reads docblocks at runtime and breaks when fast
; shutdown frees objects early on some PHP builds.
opcache.fast_shutdown = 0

; Keep error detail in the log, never in the HTTP response.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Do not advertise the PHP version in response headers.
expose_php = Off
