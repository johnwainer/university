# security-headers.conf
# Installed at /etc/nginx/snippets/paeu-security-headers.conf by 11-api-nginx-tls.sh.
#
# NOTE: no Access-Control-* header is set here on purpose. The Fastify app
# registers @fastify/cors itself (origin: true); adding CORS headers in nginx
# too would emit duplicates and browsers reject that.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

# This is a JSON API: never let a browser treat a response as a document.
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Strip anything the upstream (or a future middleware) might leak.
proxy_hide_header X-Powered-By;
proxy_hide_header X-AspNet-Version;
proxy_hide_header Server;
