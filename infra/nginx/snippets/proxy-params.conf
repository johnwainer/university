# proxy-params.conf
# Installed at /etc/nginx/snippets/paeu-proxy-params.conf by 11-api-nginx-tls.sh.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header Connection        "";

# Fastify streams video range requests from disk for the demo asset; never
# buffer the whole body in nginx.
proxy_buffering      off;
proxy_request_buffering off;

proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;
send_timeout          120s;

# The Moodle sync endpoints can legitimately take a while.
proxy_next_upstream error timeout http_502 http_503 http_504;
